# Builds the native iPhone app (Capacitor) on a macOS runner and uploads an UNSIGNED
# .ipa you can sideload with Sideloadly (free Apple ID) — see docs/NATIVE-APP.md.
# macOS minutes cost 10x, so this only runs when asked: Actions → "iOS app" → Run
# workflow, or when you push a version tag (git tag v0.2.0 && git push --tags).
name: iOS app
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Copy the web app in and sync native plugins
        run: npm run sync
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry PeekPets-unsigned.ipa Payload
          ls -lh PeekPets-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PeekPets-unsigned-ipa
          path: app/PeekPets-unsigned.ipa
          retention-days: 30
