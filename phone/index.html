<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Peek Pets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="A tiny pet that lives on your phone and watches your PC cursor.">
  <meta name="theme-color" content="#FFF3EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Peek Pets">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__photo" id="backdrop"></div>
    <div class="scene__light"></div>
    <div class="scene__blob scene__blob--a"></div>
    <div class="scene__blob scene__blob--b"></div>
    <div class="scene__floor"></div>
  </div>

  <canvas id="stageBack" class="stage stage--layer" aria-hidden="true"></canvas>
  <canvas id="glStage" class="stage stage--layer" aria-hidden="true"></canvas>
  <canvas id="stage" class="stage" role="img" aria-label="Your pet"></canvas>
  <div id="dim" class="dim" aria-hidden="true"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <header class="topbar">
    <button id="petBtn" class="avatar" type="button" aria-label="Choose your pet">
      <canvas id="avatarCanvas" width="96" height="96"></canvas>
    </button>
    <div class="bond" role="meter" aria-label="Bond with your pet" aria-valuemin="0" aria-valuemax="100" id="bond">
      <svg class="bond__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.8 6.6 4.6c2.1-.1 3.7 1.1 4.6 2.6.9-1.5 2.5-2.7 4.6-2.6 3.6.2 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
      <div class="bond__bar"><i id="bondFill"></i></div>
      <span class="bond__level" id="bondLevel">Lv 1</span>
    </div>
    <button id="styleBtn" class="icon-btn" type="button" aria-label="Style: wardrobe and photos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a2.6 2.6 0 0 0-2.6 2.6h2a.6.6 0 1 1 .9.5c-.8.5-1.3 1.1-1.3 2v.9L2.6 15.4a1.8 1.8 0 0 0 1 3.3h16.8a1.8 1.8 0 0 0 1-3.3L13 9.2v-.6c.9-.6 1.6-1.6 1.6-2.8A2.6 2.6 0 0 0 12 3.2zm0 8 7.2 5.5H4.8z"/></svg>
    </button>
    <button id="powersBtn" class="icon-btn icon-btn--powers" type="button" aria-label="Powers: ways your pet can help on the PC">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 2.2 4.6 13.3c-.4.5 0 1.2.6 1.2h5.3l-1.3 7.1c-.1.7.8 1.1 1.2.5l8.8-11.1c.4-.5 0-1.2-.6-1.2h-5.3l1.3-7.1c.1-.7-.8-1.1-1.2-.5z"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm8.4-2.6.1-.9-.1-.9 2-1.6-2-3.4-2.4.9a7 7 0 0 0-1.6-.9L16 3.5h-4l-.4 2.5a7 7 0 0 0-1.6.9l-2.4-.9-2 3.4 2 1.6-.1.9.1.9-2 1.6 2 3.4 2.4-.9c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.4.9 2-3.4z"/></svg>
    </button>
  </header>

  <div class="statusrow">
    <button id="statusChip" class="chip" type="button" data-state="solo">
      <i class="chip__dot" aria-hidden="true"></i>
      <span id="statusText" role="status" aria-live="polite">Solo mode</span>
    </button>
    <div id="factChip" class="fact" hidden></div>
  </div>

  <div id="bubble" class="bubble" role="status" aria-live="polite" hidden></div>

  <div id="tray" class="tray" aria-label="Running powers" hidden></div>
  <section id="nudge" class="nudge" role="status" aria-live="polite" hidden></section>

  <div id="snackbar" class="snackbar" role="group" aria-label="Pick a snack" hidden></div>
  <div id="playbar" class="snackbar" role="group" aria-label="Pick a game" hidden></div>
  <div id="gamelayer" class="gamelayer" hidden></div>
  <div id="gamehud" class="gamehud" hidden>
    <b id="gameScore">0</b><span id="gameInfo"></span>
    <button id="gameQuit" class="icon-btn icon-btn--small" type="button" aria-label="Quit game">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" class="stroke"/></svg>
    </button>
  </div>
  <section id="gameover" class="gameover" role="status" aria-live="polite" hidden></section>
  <nav class="dock" aria-label="Pet actions">
    <button class="dock__btn" type="button" data-action="play" aria-pressed="false" aria-expanded="false" aria-controls="playbar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M5 9.5c4 1.4 10 1.4 14 0M5 14.5c4-1.4 10-1.4 14 0" class="stroke"/></svg>
      <span>Play</span>
    </button>
    <button class="dock__btn" type="button" data-action="snack" aria-expanded="false" aria-controls="snackbar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 6.3c.4-1.9 1.9-3.3 3.9-3.6.3 0 .5.2.4.5-.4 1.6-1.6 2.8-3.1 3.2 3.2.3 5.7 3 5.7 6.4 0 4.2-3 8.2-6.1 8.2-.6 0-1.1-.2-1.4-.4a1.3 1.3 0 0 0-1.2 0c-.4.2-.8.4-1.4.4C6.3 21 3.3 17 3.3 12.8a6.4 6.4 0 0 1 8.4-6.1c.3.1.6 0 .9-.4z"/></svg>
      <span>Snack</span>
    </button>
    <button class="dock__btn" type="button" data-action="cheer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"/></svg>
      <span>Cheer</span>
    </button>
    <button class="dock__btn" type="button" data-action="dance">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a3 3 0 1 1-2-2.8V5.2l11-2v11.3a3 3 0 1 1-2-2.8V7.4l-7 1.3z"/></svg>
      <span>Dance</span>
    </button>
    <button class="dock__btn" type="button" data-action="nap" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
      <span>Nap</span>
    </button>
  </nav>

  <pre id="hud" class="hud" hidden></pre>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="sheetScrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__grab" aria-hidden="true"></div>
    <header class="sheet__head">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="icon-btn icon-btn--small" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" class="stroke"/></svg>
      </button>
    </header>
    <div id="sheetBody" class="sheet__body"></div>
  </section>

  <noscript>Peek Pets needs JavaScript to come alive.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
